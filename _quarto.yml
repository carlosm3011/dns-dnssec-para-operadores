project:
  type: book

book:
  title: "DNS y DNSSEC para Operadores"
  author:
    - name: "Carlos Martinez-Cagnazzo"
      email: "carlos@lacnic.net"
      orcid: "0000-0001-8828-5239"
      affiliation:
        - name: "LACNIC"
          city: Montevideo
          country: Uruguay
          url: "https://www.lacnic.net"
    - name: "Nicolás Antoniello"
      email: "nantoniello@gmail.com"
  abstract: >
    Este curso ofrece una introducción práctica a DNSSEC orientada a
    operadores de redes pequeños y medianos cubriendo desde los fundamentos de firma y
    validación hasta la gestión de claves con KASP en BIND. A lo largo
    de varios módulos aborda el monitoreo y la resolución de problemas,
    arquitecturas de firmante oculto (hidden signer) y temas avanzados
    como NSEC3, rollover de algoritmos, CDS/CDNSKEY y configuraciones
    multi-firmantes.
  keyword: "dns, DNSSEC, bind, troubleshooting"
  license: "CC BY"
  version: "0.5"
  date: 2026-08-07
  chapters:
    - index.qmd
    - 01-Introduccion.qmd
    - 02-Registros.qmd
    - 03-Zonas-BIND.qmd
    - 04-Firmando-con-BIND-y-KASP.qmd
    - 05-Monitoreo-Troubleshooting.qmd
    - 06-Arquitectura-Hidden-Signer.qmd
    - 07-DNSSEC-Avanzado.qmd
