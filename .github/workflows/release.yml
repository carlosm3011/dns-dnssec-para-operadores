name: Publish PDF release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find PDF in _book
        id: pdf
        run: |
          PDF_PATH=$(find _book -maxdepth 1 -iname "*.pdf" | head -n 1)
          if [ -z "$PDF_PATH" ]; then
            echo "No PDF found under _book" >&2
            exit 1
          fi
          echo "path=$PDF_PATH" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$PDF_PATH")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pdf.outputs.path }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
